name: Validate surface
on: [push, pull_request]
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: local-ci-only
      PGDATABASE: studio_test
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql -v ON_ERROR_STOP=1 -f tools/database-tests/bootstrap.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610180001_studio_accounts.sql
      - run: psql -v ON_ERROR_STOP=1 -f tools/database-tests/isolation.sql
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: git diff --exit-code
