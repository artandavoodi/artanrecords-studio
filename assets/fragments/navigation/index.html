<header class="site-navigation label-navigation">
  <a class="skip-link" href="#main-content">{{skip}}</a>
  <a class="label-header-logo" href="/" aria-label="{{name}}"><img class="label-wordmark label-wordmark--light" src="/{{wordmarkLight}}" alt=""><img class="label-wordmark label-wordmark--dark" src="/{{wordmarkDark}}" alt=""></a>
  <button class="label-menu-theme" data-theme-toggle data-dark-label="{{dark}}" data-light-label="{{light}}" aria-label="{{dark}}" aria-pressed="false" type="button" hidden></button>
  <div class="label-home-actions label-header-actions">{{homeLinks}}</div>
  <button class="site-menu-toggle" data-menu-toggle data-close-label="{{menuClose}}" aria-label="{{menuOpen}}" aria-expanded="false" aria-controls="site-menu" type="button" hidden>
    <span class="site-menu-toggle__line" aria-hidden="true"></span>
    <span class="site-menu-toggle__line" aria-hidden="true"></span>
  </button>
</header>
<section class="site-menu" id="site-menu" data-menu>
  <div class="site-menu__surface"><nav class="site-menu__links" aria-label="{{menuOpen}}">{{links}}</nav></div>
</section>
