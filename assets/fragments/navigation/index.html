<header class="site-navigation">
  <a class="skip-link" href="#main-content">{{skip}}</a>
  <button class="site-theme-toggle" data-theme-toggle aria-label="{{dark}}" aria-pressed="false" type="button" hidden></button>
  <button class="site-menu-toggle" data-menu-toggle aria-label="{{menuOpen}}" aria-expanded="false" aria-controls="site-menu" type="button" hidden>
    <span class="site-menu-toggle__line" aria-hidden="true"></span>
    <span class="site-menu-toggle__line" aria-hidden="true"></span>
  </button>
</header>
<section class="site-menu" id="site-menu" data-menu>
  <div class="site-menu__surface"><nav class="site-menu__links" aria-label="{{menuOpen}}">{{links}}</nav></div>
</section>
